name: Deploy Theme to WordPress.org

on:
  release:
    # types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (must match the Version header in style.css)'
        required: true

# WordPress.org is a single SVN repository, so never run two deploys at once.
concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    # Pre-releases stay on GitHub only.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve and verify version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          STYLE_VERSION="$(grep -m1 -i '^[[:space:]]*Version:' style.css | sed -E 's/.*[Vv]ersion:[[:space:]]*//' | tr -d '[:space:]')"
          echo "ℹ︎ Tag version is $VERSION"
          echo "ℹ︎ style.css version is $STYLE_VERSION"
          if [ "$VERSION" != "$STYLE_VERSION" ]; then
            echo "✗ Tag $TAG does not match the Version header in style.css ($STYLE_VERSION)."
            echo "  WordPress.org rejects mismatched versions, so stopping before the SVN commit."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      # WordPress.org only accepts a brand new version directory. Re-committing an
      # existing one is refused with a 403, which surfaces as the same
      # "Access to '/!svn/me' forbidden" error as a bad credential, so check first.
      - name: Verify the version is not already published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://themes.svn.wordpress.org/bloqra/$VERSION/"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          if [ "$CODE" = "200" ]; then
            echo "✗ Version $VERSION already exists at $URL"
            echo "  WordPress.org does not allow overwriting a published version."
            echo "  Bump the version in style.css and readme.txt, then tag again."
            exit 1
          fi
          echo "ℹ︎ $VERSION is not published yet (HTTP $CODE), continuing."

      # All themes share ONE SVN repository rooted at /, so write permission is
      # granted per theme to the account that owns it. Probe it up front rather
      # than discovering it after the whole tree has been copied.
      - name: Verify SVN credentials can commit
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          CODE="$(curl -s -o /dev/null -w '%{http_code}' \
            -u "$SVN_USERNAME:$SVN_PASSWORD" \
            -X POST --data 'preflight' \
            'https://themes.svn.wordpress.org/!svn/me')"
          case "$CODE" in
            400|201)
              echo "ℹ︎ SVN credentials accepted (HTTP $CODE)." ;;
            401)
              echo "✗ WordPress.org rejected the credentials (HTTP 401)."
              echo "  SVN_USERNAME must be the wordpress.org username (case-sensitive),"
              echo "  and SVN_PASSWORD the generated SVN password, not the account password."
              exit 1 ;;
            403)
              echo "✗ Credentials are valid but this account cannot write (HTTP 403)."
              echo "  Commit rights belong to the account that owns the theme on"
              echo "  wordpress.org/themes/bloqra/, and that account must have 2FA enabled."
              exit 1 ;;
            *)
              echo "✗ Unexpected response from WordPress.org SVN (HTTP $CODE)."
              exit 1 ;;
          esac

      - name: WordPress Theme Deploy
        uses: kawsarahmedr/wordpress-theme-deploy@master
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: bloqra
          VERSION: ${{ steps.version.outputs.version }}
