name: Deploy Theme to WordPress.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (must match the Version header in style.css)'
        required: true

# WordPress.org is a single SVN repository, so never run two deploys at once.
concurrency:
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    # Pre-releases stay on GitHub only.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve and verify version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          STYLE_VERSION="$(grep -m1 -i '^[[:space:]]*Version:' style.css | sed -E 's/.*[Vv]ersion:[[:space:]]*//' | tr -d '[:space:]')"
          echo "ℹ︎ Tag version is $VERSION"
          echo "ℹ︎ style.css version is $STYLE_VERSION"
          if [ "$VERSION" != "$STYLE_VERSION" ]; then
            echo "✗ Tag $TAG does not match the Version header in style.css ($STYLE_VERSION)."
            echo "  WordPress.org rejects mismatched versions, so stopping before the SVN commit."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: WordPress Theme Deploy
        uses: kawsarahmedr/wordpress-theme-deploy@master
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: bloqra
          VERSION: ${{ steps.version.outputs.version }}
